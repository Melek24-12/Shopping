<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shoPin Shopping Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            min-height: 100vh;
            background-color: rgb(245, 239, 236);
            display: flex;
            flex-direction: column;

        }


        body {
            font-family: sans-serif;
        }

        .header {
            background-color: rgb(177, 104, 45);
            padding: 8px;
            text-align: center;
            color: white;
        }

        .nav {
            background-color: rgb(255, 253, 252);
            display: flex;
            justify-content: space-between;
            padding: 10px;


        }

        .navList {
            display: flex;
            align-items: center;
        }

        .navList input[type="text"] {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid grey;
        }

        .basliq ul {
            list-style: none;
            display: flex;
            justify-content: space-between;
            gap: 60px;
        }

        .basliq a {
            text-decoration: none;
            color: grey;
            color: inherit;
        }

        #LogInA {
            background-color: rgb(177, 104, 45);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: underline;
        }


        img {
            width: 250px;
            height: 250px;
            margin-left: 100px;
            padding: 10px;
        }

        .content {
            display: flex;

            flex-direction: row;
            background-color: white;
            height: 250px;
            width: 95%;
            border-radius: 10px;
            margin-top: 20px;
            gap: 170px;

        }

        .content h2 {
            margin-left: 50px;
            margin-top: 50px;
            font-family: cursive;
            font-size: 30px;
        }

        .content button {
            margin-left: 50px;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: rgb(177, 104, 45);
            color: white;
            border-radius: 5px;
            outline: none;
            border: 1px solid rgb(114, 78, 49);
            box-shadow: rgba(0, 0, 0, 0.3) 0px 19px 38px, rgba(0, 0, 0, 0.22) 0px 15px 12px;
        }

        /* .content button a{
            text-decoration: none;
            color: white;
        } */

        .contentFlex {
            display: flex;
            justify-content: center;

        }

        .category {
            margin-top: 20px;
        }

        .category ul {
            list-style: none;
            display: flex;
            justify-content: space-around;

        }

        .category li {
            background-color: rgb(182, 118, 76);
            border: 1px solid rgb(177, 104, 45);
            border-radius: 10px;
            padding: 5px 10px;
            gap: 10px;

        }

        .category li a {
            text-decoration: none;
            color: rgb(255, 255, 255);
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin: 0;
            padding: 0;
            border-radius: 8px;
        }

        .card h3 {
            margin: 10px 0;
        }

        .card p {
            color: rgb(177, 104, 45);
            font-weight: bold;
        }

        .card span {
            display: block;
            margin-top: 5px;
            color: #555;
            font-size: 14px;
        }

        .card button {
            margin-top: 10px;
            padding: 8px 15px;
            background-color: rgb(177, 104, 45);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .card button:hover {
            background-color: rgb(202, 141, 92);
        }



        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(245, 239, 236);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 9999;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #e5d4c8;
            border-top-color: rgb(177, 104, 45);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader p {
            color: rgb(177, 104, 45);
            font-size: 17px;
        }

        .loader.hide {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .icon {
            font-size: larger;
        }

        #shop {
            background-color: #b9733a;
            padding: 6px 10px;
            padding-top: 5px;
            padding-bottom: 5px;
            border-radius: 20px;
            color: white;
        }

        #shop a {
            color: white;
            padding: 0px;
            padding-bottom: 5px;
        }

        .categoryUl {
            text-decoration: none;
        }

        li {
            border-radius: 20px;
            transition: background-color 0.3s ease,
                transform 0.3s ease;
        }

        li:hover {
            text-decoration: underline;
            transform: translateY(-2px);

        }

        .categoryUl li {
            background-color: rgb(182, 118, 76);
            border: 1px solid rgb(177, 104, 45);
            border-radius: 10px;
            padding: 5px 10px;
            gap: 10px;
        }

        .footer {
            background-color: rgb(156, 111, 75);
            padding: 20px;
            text-align: center;
            color: white;
            margin-top: auto;
        }
    </style>
</head>

<body>


    <div class="loader" id="loader">
        <div class="spinner"></div>

    </div>

    <div class="container">

            <div class="nav">

                <div class="logo">
                    <h1 class="logoH1">shoPIN</h1>
                </div>

                <div class="navList">
                    <ul>
                        <li id="home"><a href="./HomePage(Shopping).html">Home</a></li>
                        <li id="signUp"><a href="./SignUp(Shopping).html">Sign up</a></li>
                        <li id="shop"><a href="./ShopPage(Shopping).html">Shop</a></li>
                        <li id="about"><a href="./About(Shopping).html">About Us</a></li>
                        <li id="contact"><a href="./Contact(Shopping).html">Contact Us</a></li>
                        <li id="search"><input type="text" placeholder="Search"></li>
                        <li id="basket"><a href="./Basket(Shopping).html"><i
                                    class="fa-solid fa-cart-shopping icon"></i></a></li>
                        <li id="login"><a href="./LoginPage(Shopping).html" id="LogInA">Log In</a></li>

                    </ul>
                </div>
            </div>
        </div>

        <div class="contentFlex">
            <div class="content">
                <div class="cont1">
                    <h2>Start shopping <br> with new style</h2>
                </div>

                <div class="cont2"><img
                        src="https://img.magnific.com/premium-vector/online-shopping-stylish-girl-looking-phone-holding-shopping-bagswoman-carrying-bags-shopping-online-with-mobile-phone_348404-1300.jpg?semt=ais_hybrid"
                        alt="shopping img"></div>


            </div>

        </div>

        <div class="category">
            <ul class="categoryUl">
                <li id="all"><a href="">🛍️All</a></li>
                <li id="electronics"><a href="">⚡Electronics</a></li>
                <li id="wear"><a href="">👕Wear</a></li>
                <li id="home-essentials"><a href="">🏠Home Essentials</a></li>
            </ul>
        </div>

        <div class="cards">


        </div>
        <footer class="footer">
            <p>&copy; 2026 shoPIN. All rights reserved.</p>
        </footer>
    </div>


    <script>

        let cards = {

            card17: {

            card18: {

                title: "Bookshelf",
                price: 280,
                description: "Practical bookshelf for organizing books and decorations.",
                category: "home-essentials"
            },

            card19: {
                img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab",
                title: "Hoodie",
                price: 75,
                description: "Warm and cozy hoodie suitable for casual outfits.",
                category: "wear"
            },

            card20: {
                img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853",
                title: "Laptop",
                price: 1500,
                description: "Portable laptop for studying, working, and everyday tasks.",
                category: "electronics"
            }



        }

        let cardsDiv = document.querySelector('.cards');

        function showCards(category) {
            cardsDiv.innerHTML = "";

            for (let card in cards) {
                let cardData = cards[card];

                if (category === "all" || cardData.category === category) {
                    cardsDiv.innerHTML += `
                <div class="card">
                    <img src="${cardData.img}" alt="${cardData.title}">
                    <h3>${cardData.title}</h3>
                    <span>${cardData.description}</span>
                    <p>$${cardData.price}</p>
                    <button data-id="${card}">Add to Cart</button>
                </div>
            `;
                }
            }
        }

        showCards("all");

        document.querySelector("#all").onclick = () => showCards("all");
        document.querySelector("#electronics").onclick = () => showCards("electronics");
        document.querySelector("#wear").onclick = () => showCards("wear");
        document.querySelector("#home-essentials").onclick = () => showCards("home-essentials");

        let all = document.getElementById('all');
        let electronics = document.getElementById('electronics');
        let wear = document.getElementById('wear');
        let homeEssentials = document.getElementById('home-essentials');



        all.addEventListener('click', function (event) {
            event.preventDefault();
            cards.forEach(card => {
                if (card.category === "electronics" || card.category === "wear" || card.category === "home-essentials") {
                    cardsDiv.innerHTML += `
                <div class="card">
                    <img src="${card.img}" alt="${card.title}">
                    <h3>${card.title}</h3>
                    <span>${card.description}</span>
                    <p>$${card.price}</p>
                    <button>Add to Cart</button>
                </div>
            `;
                }
            });
        });



        let loader = document.getElementById("loader");

        window.addEventListener("pageshow", function () {
            loader.classList.add("hide");
        });

        document.querySelectorAll("a[href]").forEach(function (link) {
            link.addEventListener("click", function () {
                let href = link.getAttribute("href");

                if (href && href !== "#" && !href.startsWith("#")) {
                    loader.classList.remove("hide");
                }
            });
        });

        cardsDiv.addEventListener("click", function (event) {
            if (event.target.tagName === "BUTTON") {
                let cardId = event.target.dataset.id;
                let cardData = cards[cardId];

                let cartItems =
                    JSON.parse(localStorage.getItem("cartItems")) || [];

                cartItems.push(cardData);
                localStorage.setItem("cartItems", JSON.stringify(cartItems));

                alert(`${cardData.title} has been added to your cart!`);
            }
        });


    </script>
