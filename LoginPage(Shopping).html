<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> shoPin Login Page </title>
    <!-- bootstrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/263/263142.png" type="image/png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main-container {
            min-height: 100vh;
            background-color: rgb(245, 239, 236);
        }

        body {
            font-family: sans-serif;
        }

        .header {
            background-color: rgb(177, 104, 45);
            padding: 8px;
            text-align: center;
            color: white;
        }

        .nav {
            background-color: rgb(255, 253, 252);
            display: flex;
            justify-content: space-between;
            padding: 10px;

        }

        .nav input[type="text"] {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid grey;
        }

        .navList {
            display: flex;
            align-items: center;
        }

        .navList input[type="text"] {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid grey;
        }

        ul {
            list-style: none;
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        a {
            text-decoration: none;
            color: grey;
        }

        #LogInA,
        #logout a {
            background-color: #70452b;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        #LogInA:hover,
        #logout a:hover {
            background-color: #9a6743;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(112, 69, 43, 0.3);
        }

        #login[hidden] {
            display: none !important;
        }

        #logout[hidden] {
            display: none !important;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;

        }

        form {
            background-color: white;
            height: 300px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: rgba(0, 0, 0, 0.3) 0px 19px 38px, rgba(0, 0, 0, 0.22) 0px 15px 12px;
            padding: 20px;
        }

        .log-in {
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            gap: 20px;
            width: 300px;
            height: 200px;
        }

        form input {
            padding: 8px;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid grey;
        }

        form button {
            padding: 10px;
            background-color: rgb(177, 104, 45);
            color: white;
            border: none;
            border-radius: 5px;
        }

        .login {
            color: grey;
        }



        li {
            border-radius: 20px;
            transition: background-color 0.3s ease,
                transform 0.3s ease;
        }

        li:hover {
            text-decoration: underline;
            transform: translateY(-2px);

        }

        .log-in p {
            font-size: 14px;
            color: grey;
        }

        .log-in a {
            color: rgb(177, 104, 45);
            text-decoration: none;
        }

        .dropdown-menu {
            background-color: white;
            border-radius: 10px;
            padding: 8px;
        }

        .dropdown-item {
            color: #70452b;
            padding: 10px;
        }

        .dropdown-item:hover {
            background-color: #f5efec;
            color: #70452b;
        }

        .dropdown-toggle {
            color: #70452b;
            font-size: 22px;
            border: none;
        }

    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">50% Endirim</div>
        <div class="nav">

            <div class="logo">
                <h1 class="logoH1">shoPIN</h1>
            </div>

            <div class="navList">
                <ul>
                        <li id="home"><a href="./HomePage(Shopping).html">Home</a></li>
                        <li><a href="./SignUp(Shopping).html">Sign up</a></li>
                        <li><a href="./ShopPage(Shopping).html">Shop</a></li>
                        <li><a href="./Contact(Shopping).html">Contact Us</a></li>
                        <li><a href="./About(Shopping).html" id="aboutLink">About Us</a></li>
                        <li class="nav-item dropdown">
                            <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                <i class="fa-solid fa-ellipsis"></i>
                            </button>

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" href="./AddProduct(Shopping).html">
                                        Add Product
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="./MyProducts(Shopping).html">
                                        My Products
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="./CheckOut(Shopping).html">
                                        Checkout
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item" href="./Profile(Shopping).html">
                                        Profile
                                    </a>
                                </li>
                            </ul>
                        </li>
                        <li><input type="text" placeholder="Search"></li>
                        <li><a href="./Basket(Shopping).html"><i class="fa-solid fa-cart-shopping"></i></a></li>
                        <li id="login"><a href="./LoginPage(Shopping).html" id="LogInA">Log In</a></li>
                        <li id="logout" hidden><a href="#">Log Out</a></li>

                    </ul>
            </div>
        </div>
        <div class="content">
            <form action="">
                <div class="log-in">
                    <h2 class="logIn">Log In</h2>
                    <p>If you don't have an account, <a href="./SignUp(Shopping).html">sign up here</a>.</p>
                    <input type="text" id="username" placeholder="Username">
                    <input type="password" id="pin" placeholder="Password">
                    <button type="submit">Log In</button>
                </div>


            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

        let inpName = document.querySelector('#username');
        let inpPass = document.querySelector('#pin');

        let LogInBtn = document.querySelector('button[type="submit"]');

        LogInBtn.addEventListener('click', function (e) {
            e.preventDefault();
            if (!isNaN(inpName.value) || inpName.value.trim() === "" || inpPass.value.trim() === "") {
                Swal.fire({
                    title: "Please enter valid username and password",
                    icon: "error",
                    draggable: true
                });
                return;
            }



            if (localStorage.getItem("userData")) {
                let userData = JSON.parse(localStorage.getItem("userData"));
                if (inpName.value.trim() === userData.name.trim() && inpPass.value === userData.password) {
                    Swal.fire({
                        title: "Log in Successful!",
                        icon: "success",
                        draggable: true
                    });

                    localStorage.setItem("currentUserEmail", userData.email);
                } else if (inpName.value.trim() !== userData.name.trim() || inpPass.value !== userData.password) {
                    Swal.fire({
                        title: "Invalid username or password.(or just try to sign up first)",
                        icon: "error",
                        draggable: true
                    });
                    inpPass.value = "";
                    inpName.value = "";
                }
            } else if (localStorage.getItem("userData") == null) {
                Swal.fire({
                    title: "No user data found. Please sign up first.",
                    icon: "error",
                    draggable: true

                });
            }

        })

        let login = document.getElementById("login");
        let logout = document.getElementById("logout");

        let currentUserEmail = localStorage.getItem("currentUserEmail");

        if (currentUserEmail) {
            login.hidden = true;
            logout.hidden = false;
        } else {
            login.hidden = false;
            logout.hidden = true;
        }


        logout.addEventListener("click", function (e) {
            e.preventDefault();
            localStorage.removeItem("currentUserEmail");
            login.hidden = false;
            logout.hidden = true;
        });

    </script>
</body>

</html>
